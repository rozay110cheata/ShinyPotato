<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>rozay110</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #0a0a0a;
    color: #eaeaea;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background-image: radial-gradient(circle at 50% 0%, #1a1a1a 0%, #0a0a0a 70%);
  }

  .card {
    background: #111;
    border: 1px solid #222;
    border-radius: 16px;
    padding: 40px 32px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), 0 0 80px rgba(255, 255, 255, 0.02);
  }

  .pfp {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #333;
    margin-bottom: 20px;
    transition: transform 0.3s ease, border-color 0.3s ease;
  }

  .pfp:hover {
    transform: scale(1.05);
    border-color: #666;
  }

  h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 6px;
    color: #fff;
  }

  .tag {
    font-size: 13px;
    color: #777;
    margin-bottom: 22px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .about {
    font-size: 15px;
    line-height: 1.7;
    color: #bbb;
    margin-bottom: 28px;
  }

  .about strong {
    color: #fff;
  }

  .links {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .links a {
    text-decoration: none;
    color: #eaeaea;
    border: 1px solid #2a2a2a;
    padding: 9px 18px;
    border-radius: 8px;
    font-size: 13px;
    letter-spacing: 0.5px;
    transition: all 0.25s ease;
    background: #161616;
  }

  .links a:hover {
    background: #fff;
    color: #000;
    border-color: #fff;
  }

  .footer {
    margin-top: 26px;
    font-size: 11px;
    color: #444;
    letter-spacing: 1px;
  }
</style>
</head>
<body>

  <div class="card">
    <img
      src="https://raw.githubusercontent.com/rozay110cheata/James/main/IMG_0921.png"
      alt="rozay110 pfp"
      class="pfp"
    >

    <h1>rozay110</h1>
    <p class="tag"></p>

    <p class="about">
      playdough and zurxz are my bros.<br>
      i'm very cool too.
    </p>

    <div class="links">
      <a href="discord">discord</a>
      <a href="tiktok">tiktok</a>
      <a href="contact">contact</a>
    </div>

    <p class="footer">© rozay110</p>
  </div>

</body>
</html>
