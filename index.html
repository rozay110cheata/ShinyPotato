<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>rozays about me</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at 50% 35%, #17172b 0%, #090910 45%, #030306 100%);
            color: #e8e8ee;
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
        }

        /* Background glow */
        body::before {
            content: "";
            position: fixed;
            width: 650px;
            height: 650px;
            left: 50%;
            top: 25%;
            transform: translate(-50%, -50%);
            background: radial-gradient(
                circle,
                rgba(139, 92, 246, 0.10),
                transparent 65%
            );
            pointer-events: none;
        }

        .page {
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            text-align: center;
            animation: fadeIn 1s ease;
        }

        /* Profile */
        .profile {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 25px;

            /* Replace this with your own image if you want */
            background:
                linear-gradient(135deg, #7c3aed, #a855f7);

            border: 3px solid rgba(255,255,255,0.15);

            box-shadow:
                0 0 25px rgba(139, 92, 246, 0.55),
                0 0 60px rgba(139, 92, 246, 0.15);

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        .profile span {
            font-size: 34px;
            font-weight: 800;
            color: white;
        }

        /*
        If you want an actual image, replace the profile div with:

        <img class="profile" src="profile.png">

        */

        /* Main title */
        h1 {
            font-size: clamp(45px, 7vw, 78px);
            font-weight: 900;
            letter-spacing: -3px;
            color: #ffffff;

            text-shadow:
                0 0 8px #8b5cf6,
                0 0 25px #8b5cf6,
                0 0 55px rgba(139, 92, 246, 0.8);

            margin-bottom: 10px;

            animation: glow 3s ease-in-out infinite alternate;
        }

        .pronouns {
            color: #8d8d9c;
            font-size: 15px;
            letter-spacing: 1px;
            margin-bottom: 25px;
        }

        .bio {
            max-width: 750px;
            margin: 0 auto 30px;
            color: #c7c7d0;
            font-size: 16px;
            line-height: 1.7;
        }

        .heart {
            color: #ff4f81;
        }

        /* Sections */
        .section {
            margin-top: 25px;
        }

        .section-title {
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #696978;
            margin-bottom: 13px;
            font-weight: 700;
        }

        /* Pills */
        .pills {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 9px;
            max-width: 900px;
            margin: auto;
        }

        .pill {
            padding: 8px 15px;
            border-radius: 999px;

            background: rgba(255,255,255,0.055);
            border: 1px solid rgba(255,255,255,0.08);

            color: #cfcfd8;
            font-size: 13px;

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .pill:hover {
            transform: translateY(-3px);
            background: rgba(139, 92, 246, 0.14);
            border-color: rgba(139, 92, 246, 0.5);
            box-shadow: 0 5px 25px rgba(139, 92, 246, 0.12);
        }

        /* Social buttons */
        .socials {
            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
            margin-top: 32px;
        }

        .social {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

            min-width: 145px;
            padding: 13px 22px;

            border-radius: 999px;

            color: white;
            text-decoration: none;

            background: rgba(88, 80, 200, 0.22);
            border: 1px solid rgba(115, 105, 255, 0.55);

            box-shadow:
                0 0 15px rgba(99, 102, 241, 0.15);

            font-size: 14px;
            font-weight: 700;

            transition: all 0.25s ease;
        }

        .social:hover {
            transform: translateY(-4px) scale(1.02);
            background: rgba(99, 102, 241, 0.38);
            box-shadow:
                0 0 30px rgba(99, 102, 241, 0.35);
        }

        .discord-icon {
            font-size: 18px;
        }

        /* Divider */
        .divider {
            width: 100%;
            height: 1px;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,0.10),
                transparent
            );
            margin: 40px auto 25px;
        }

        .footer {
            color: #555563;
            font-size: 12px;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes glow {
            from {
                text-shadow:
                    0 0 8px #8b5cf6,
                    0 0 20px #8b5cf6;
            }

            to {
                text-shadow:
                    0 0 12px #8b5cf6,
                    0 0 35px #8b5cf6,
                    0 0 65px rgba(139, 92, 246, 0.7);
            }
        }

        /* Mobile */
        @media (max-width: 600px) {

            .page {
                padding: 45px 18px;
            }

            .profile {
                width: 95px;
                height: 95px;
            }

            h1 {
                font-size: 43px;
                letter-spacing: -2px;
            }

            .bio {
                font-size: 14px;
            }

            .social {
                width: 100%;
                max-width: 260px;
            }
        }
    </style>
</head>

<body>

</div>

</body>
</html>
